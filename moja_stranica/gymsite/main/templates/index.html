<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="https://www.w3schools.com/html/styles.css">
    <title>TeamGym</title>
</head>
<body>

{% if user.is_authenticated %}
    <h2>Pozdrav, {{ user.username }}</h2>

    <a href="{% url 'main:korisnici' %}">Korisnici</a>
    <a href="{% url 'main:treneri' %}">Treneri</a>
    <a href="{% url 'main:treninzi' %}">Treninzi</a>

    

    <form method="post" action="{% url 'logout' %}" style="margin-top: 50px">
        {% csrf_token %}
        <button type="submit">Logout</button>
    </form>
{% else %}
    <h2>Niste prijavljeni</h2>
    <a href="{% url 'login' %}">Login</a>
    <a href="{% url 'main:register' %}">Registracija</a>
{% endif %}


</body>
</html>
